apiVersion: v1
kind: ConfigMap
metadata:
  name: ig2tg-config
  namespace: ig2tg
data:
  config.yaml: |
    telegram:
      bot_token: "${env:TG_BOT_TOKEN}"
      supergroup_id: -1001234567890
      owner_id: 123456789

    bridge:
      db_path: "/app/data/bridge.sqlite"
      media_timeout_ms: 15000
      backfill_on_start: true
      backfill_count: 20
      topic_name_format: "@{username}"
      log_level: "info"
